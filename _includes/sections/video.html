{% assign section = include.section %}
<section class="section body-section video-section section--{{ section.theme | escape }}" id="{{ section.anchor | escape }}">
    <div class="content-shell">
        <article class="feature-card video-card">
            <div>
                <h2>{{ section.heading | escape }}</h2>
                {% if section.introduction and section.introduction != "" %}
                    <p>{{ section.introduction | escape }}</p>
                {% endif %}
            </div>
            <div class="video-frame">
                <iframe
                    src="https://www.youtube-nocookie.com/embed/{{ section.youtube_id | escape }}?rel=0"
                    title="{{ section.title | escape }}"
                    loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen
                ></iframe>
            </div>
        </article>
    </div>
</section>
