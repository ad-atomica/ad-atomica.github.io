name: Site checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [cms-preview]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-checks:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Validate editable content
        run: bundle exec ruby scripts/validate_content.rb

      - name: Test invalid content is rejected
        run: bundle exec ruby scripts/test_content_validation.rb

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - name: Check generated internal links and HTML
        run: bundle exec htmlproofer ./_site --disable-external
