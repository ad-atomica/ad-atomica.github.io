name: Synchronize CMS preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cms-preview-sync
  cancel-in-progress: false

jobs:
  synchronize:
    name: Merge production into editorial preview
    if: github.event_name == 'workflow_dispatch' || vars.CMS_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out editorial branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: cms-preview
          fetch-depth: 0

      - name: Merge main without discarding draft content
        run: |
          set -euo pipefail
          git fetch origin main cms-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main
          git push origin HEAD:cms-preview
