media:
  input: assets/uploads
  output: /assets/uploads
  rename: safe
  extensions: [jpg, jpeg, png, webp]

content:
  - name: website
    label: Website
    type: group
    items:
      - name: home-page
        label: Homepage sections
        type: file
        path: _data/home.yml
        format: yaml
        fields:
          - name: hero
            label: Hero
            type: object
            fields:
              - name: heading
                label: Main heading
                type: string
                required: true
                options:
                  minlength: 10
                  maxlength: 60
              - name: cta_label
                label: Button label
                type: string
                required: true
                options:
                  maxlength: 32
          - name: sections
            label: Body sections
            type: block
            required: true
            description: Add, remove, or drag sections between the fixed hero and contact areas. Give no more than five sections a navigation label.
            list:
              min: 1
              max: 12
              collapsible:
                collapsed: true
                summary: "{index}. {type} — {heading} [{anchor}]"
            blockKey: type
            blocks:
                - name: intro
                  label: Intro
                  fields:
                    - name: anchor
                      label: Anchor
                      type: string
                      required: true
                      description: A unique lowercase name used for navigation, for example our-science.
                      pattern:
                        regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
                        message: Use lowercase letters, numbers, and single hyphens only.
                      options:
                        maxlength: 50
                    - name: navigation_label
                      label: Navigation label
                      type: string
                      description: Leave blank to keep this section out of the main navigation.
                      options:
                        maxlength: 24
                    - name: theme
                      label: Theme
                      type: select
                      required: true
                      options:
                        values:
                          - name: neutral
                            label: Neutral
                          - name: accent
                            label: Accent
                    - name: eyebrow
                      label: Section label
                      type: string
                      options:
                        maxlength: 24
                    - name: heading
                      label: Heading
                      type: string
                      required: true
                      options:
                        minlength: 10
                        maxlength: 80
                    - name: lead
                      label: Lead paragraph
                      type: text
                      options:
                        maxlength: 500
                    - name: paragraphs
                      label: Paragraphs
                      type: text
                      required: true
                      list:
                        min: 1
                        max: 3
                        collapsible: false
                      options:
                        minlength: 40
                        maxlength: 700

                - name: card-grid
                  label: Card grid
                  fields:
                    - name: anchor
                      label: Anchor
                      type: string
                      required: true
                      description: A unique lowercase name used for navigation, for example capabilities.
                      pattern:
                        regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
                        message: Use lowercase letters, numbers, and single hyphens only.
                      options:
                        maxlength: 50
                    - name: navigation_label
                      label: Navigation label
                      type: string
                      description: Leave blank to keep this section out of the main navigation.
                      options:
                        maxlength: 24
                    - name: theme
                      label: Theme
                      type: select
                      required: true
                      options:
                        values:
                          - name: neutral
                            label: Neutral
                          - name: accent
                            label: Accent
                    - name: eyebrow
                      label: Section label
                      type: string
                      options:
                        maxlength: 24
                    - name: heading
                      label: Heading
                      type: string
                      options:
                        maxlength: 80
                    - name: introduction
                      label: Introduction
                      type: text
                      options:
                        maxlength: 500
                    - name: numbered
                      label: Number cards
                      type: boolean
                      required: true
                    - name: cards
                      label: Cards
                      type: object
                      required: true
                      list:
                        min: 2
                        max: 4
                        collapsible:
                          collapsed: false
                          summary: "{title} ({index})"
                      fields:
                        - name: title
                          label: Heading
                          type: string
                          required: true
                          options:
                            minlength: 5
                            maxlength: 60
                        - name: body
                          label: Description
                          type: text
                          required: true
                          options:
                            minlength: 40
                            maxlength: 500
                    - name: cta_label
                      label: Contact button label
                      type: string
                      description: Leave blank for no button. Buttons always go to the contact section.
                      options:
                        maxlength: 32

                - name: statement
                  label: Statement
                  fields:
                    - name: anchor
                      label: Anchor
                      type: string
                      required: true
                      pattern:
                        regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
                        message: Use lowercase letters, numbers, and single hyphens only.
                      options:
                        maxlength: 50
                    - name: navigation_label
                      label: Navigation label
                      type: string
                      description: Leave blank to keep this section out of the main navigation.
                      options:
                        maxlength: 24
                    - name: theme
                      label: Theme
                      type: select
                      required: true
                      options:
                        values:
                          - name: neutral
                            label: Neutral
                          - name: accent
                            label: Accent
                    - name: paragraphs
                      label: Statement paragraphs
                      type: text
                      required: true
                      list:
                        min: 1
                        max: 2
                        collapsible: false
                      options:
                        minlength: 40
                        maxlength: 700

                - name: video
                  label: Video
                  fields:
                    - name: anchor
                      label: Anchor
                      type: string
                      required: true
                      pattern:
                        regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
                        message: Use lowercase letters, numbers, and single hyphens only.
                      options:
                        maxlength: 50
                    - name: navigation_label
                      label: Navigation label
                      type: string
                      description: Leave blank to keep this section out of the main navigation.
                      options:
                        maxlength: 24
                    - name: theme
                      label: Theme
                      type: select
                      required: true
                      options:
                        values:
                          - name: neutral
                            label: Neutral
                          - name: accent
                            label: Accent
                    - name: heading
                      label: Heading
                      type: string
                      required: true
                      options:
                        maxlength: 60
                    - name: introduction
                      label: Introduction
                      type: text
                      options:
                        maxlength: 500
                    - name: youtube_id
                      label: YouTube video ID
                      type: string
                      required: true
                      description: The 11-character value after youtu.be/ or v= in a YouTube URL.
                      pattern:
                        regex: "^[A-Za-z0-9_-]{11}$"
                        message: Enter an 11-character YouTube video ID, not the full URL.
                    - name: title
                      label: Accessible video title
                      type: string
                      required: true
                      options:
                        minlength: 5
                        maxlength: 100

                - name: people-grid
                  label: People grid
                  fields:
                    - name: anchor
                      label: Anchor
                      type: string
                      required: true
                      pattern:
                        regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
                        message: Use lowercase letters, numbers, and single hyphens only.
                      options:
                        maxlength: 50
                    - name: navigation_label
                      label: Navigation label
                      type: string
                      description: Leave blank to keep this section out of the main navigation.
                      options:
                        maxlength: 24
                    - name: theme
                      label: Theme
                      type: select
                      required: true
                      options:
                        values:
                          - name: neutral
                            label: Neutral
                          - name: accent
                            label: Accent
                    - name: heading
                      label: Heading
                      type: string
                      required: true
                      options:
                        maxlength: 60
                    - name: introduction
                      label: Introduction
                      type: text
                      options:
                        maxlength: 500
                    - name: group
                      label: People to show
                      type: select
                      required: true
                      options:
                        values:
                          - name: team
                            label: Team
                          - name: advisor
                            label: Advisory
          - name: contact
            label: Contact section
            type: object
            fields:
              - name: eyebrow
                label: Section label
                type: string
                required: true
                options:
                  maxlength: 24
              - name: heading
                label: Heading
                type: string
                required: true
                options:
                  maxlength: 50
              - name: body
                label: Introduction
                type: text
                required: true
                options:
                  minlength: 40
                  maxlength: 400
              - name: cta_label
                label: Button label
                type: string
                required: true
                options:
                  maxlength: 32

      - name: site-settings
        label: Site settings
        type: file
        path: _data/site.yml
        format: yaml
        fields:
          - name: language
            label: Site language
            type: string
            required: true
            readonly: true
          - name: seo
            label: Search and social sharing
            type: object
            fields:
              - name: title
                label: Site title
                type: string
                required: true
                options:
                  minlength: 20
                  maxlength: 70
              - name: description
                label: Search description
                type: text
                required: true
                description: Aim for 120–160 characters. Avoid unapproved performance claims.
                options:
                  minlength: 50
                  maxlength: 170
              - name: social_description
                label: Social sharing description
                type: text
                required: true
                options:
                  minlength: 50
                  maxlength: 200
              - name: social_image
                label: Social sharing image
                type: image
                required: true
                readonly: true
                description: Managed by the development team during the pilot.
              - name: social_image_width
                label: Social image width
                type: number
                required: true
                readonly: true
              - name: social_image_height
                label: Social image height
                type: number
                required: true
                readonly: true
              - name: social_image_alt
                label: Social image description
                type: string
                required: true
                options:
                  minlength: 5
                  maxlength: 140
              - name: twitter_image
                label: X/Twitter sharing image
                type: image
                required: true
                readonly: true
                description: Managed by the development team during the pilot.
          - name: navigation
            label: Navigation
            type: object
            fields:
              - name: contact_label
                label: Contact
                type: string
                required: true
                options:
                  maxlength: 24
          - name: contact
            label: Contact details
            type: object
            fields:
              - name: name
                label: Contact name
                type: string
                required: true
                options:
                  maxlength: 80
              - name: role
                label: Contact role
                type: string
                required: true
                options:
                  maxlength: 100
              - name: email
                label: Email address
                type: string
                required: true
                pattern:
                  regex: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
                  message: Enter a complete email address.
              - name: email_subject
                label: Email subject
                type: string
                required: true
                options:
                  maxlength: 100
          - name: company
            label: Company details
            type: object
            fields:
              - name: legal_name
                label: Legal name
                type: string
                required: true
                options:
                  maxlength: 100
              - name: registration_country
                label: Registration jurisdiction
                type: string
                required: true
                options:
                  maxlength: 100
              - name: company_number
                label: Company number
                type: string
                required: true
                pattern:
                  regex: "^[A-Za-z0-9]{6,12}$"
                  message: Use the registered company number without spaces.
              - name: registered_office
                label: Registered office
                type: text
                required: true
                options:
                  maxlength: 250
          - name: links
            label: External links
            type: object
            fields:
              - name: linkedin
                label: LinkedIn
                type: string
                required: true
                pattern:
                  regex: "^https://(www\\.)?linkedin\\.com/.+$"
                  message: Enter a full LinkedIn HTTPS URL.

      - name: people
        label: People
        type: collection
        path: _people
        format: yaml-frontmatter
        filename: "{primary}.md"
        subfolders: false
        operations:
          create: false
          rename: false
          delete: false
        view:
          primary: name
          fields: [image, name, role, group, order, published]
          sort: [order, name]
          default:
            sort: order
            order: asc
        fields:
          - name: name
            label: Name
            type: string
            required: true
            options:
              minlength: 2
              maxlength: 80
          - name: role
            label: Role
            type: string
            required: true
            options:
              minlength: 2
              maxlength: 100
          - name: group
            label: Group
            type: select
            required: true
            options:
              values:
                - name: team
                  label: Team
                - name: advisor
                  label: Advisory
          - name: order
            label: Display order
            type: number
            required: true
            description: Use each number once within a group.
          - name: image
            label: Headshot
            type: image
            required: true
            description: Upload a square JPG, PNG, or WebP image, 240–1200 pixels wide and no larger than 500 KB.
            options:
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: image_alt
            label: Image description
            type: string
            required: true
            description: Usually the person's name. Describe meaningful visual context if needed.
            options:
              minlength: 2
              maxlength: 140
          - name: published
            label: Show on the website
            type: boolean
            required: true
          - name: bio
            label: Biography
            type: text
            required: true
            options:
              minlength: 40
              maxlength: 600

settings:
  hide: true
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "content: add {name}"
      update: "content: update {name}"
      delete: "content: remove {name}"
      rename: "content: rename {oldFilename} to {newFilename}"

actions:
  - name: request-publication
    label: Request publication
    workflow: cms-request-publication.yml
    ref: current
    cancelable: false
    confirm:
      title: Request publication?
      message: Validate the current editorial preview and open a pull request for review.
      button: Request publication
